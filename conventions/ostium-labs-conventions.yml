authentication:
  style: wallet-signature / delegate-key / public-read
  ref: authentication/ostium-labs-authentication.yml
architecture:
  pattern: build-vs-submit
  description: >-
    get*Tx() methods return unsigned transactions for external signing; write
    methods sign and submit internally based on the configured client mode
    (read-only, self-signed, delegated, Safe-based gasless).
pagination:
  style: cursor/offset
  supported_operations: [getCandles, getOrders]
  notes: >-
    getCandles() supports pagination and getOrders() supports enhanced filtering
    (added in @ostium/builder-sdk 0.4.0).
streaming:
  transport: websocket
  ref: asyncapi/ostium-labs-prices-asyncapi.yml
  operations: [streamPrices, streamAccountUpdates, streamPositionUpdates]
  builder_api_channel: WS /v1/prices/stream
idempotency:
  supported: false
  notes: >-
    No documented HTTP Idempotency-Key contract. Write actions are on-chain
    transactions/user-operations whose replay-safety is enforced by blockchain
    nonces and contract state rather than an API idempotency key.
