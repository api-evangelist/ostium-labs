  - Added OstiumAccountUpdatesStream.users getter to retrieve subscribed addresses.
  - Added optional user parameter to addOptimisticOpen() to attribute optimistic opens to specific addresses.
- version: 0.4.0
  date: '2026-06-11'
  breaking: false
  highlights:
  - Added pagination support to getCandles().
  - Added enhanced filtering to getOrders() and a new getBuilderOrders() method.
  - Added builder, ntl (USD notional), trader and timestamp fields across multiple object types.
  - Introduced account streaming via streamAccountUpdates() with low-latency confirmations and optimistic market-open overlays.
  - Added market schedule information to pair data and background attribution for SDK usage.
