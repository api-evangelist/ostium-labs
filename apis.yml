aid: ostium-labs
name: Ostium Labs
description: >-
  Ostium is a decentralized perpetual-futures exchange that lets traders access
  global real-world-asset markets — stocks, ETFs, commodities, indices, forex and
  crypto — directly from a self-custodial crypto wallet, with leverage and no
  broker or intermediary. Built on Arbitrum, the protocol pairs an on-chain OLP
  vault with an off-chain hedge that settle daily across three core participants.
  For developers, Ostium ships an official TypeScript Builder SDK (@ostium/builder-sdk)
  and a Python SDK (ostium-python-sdk) plus a public Builder API for live prices,
  OHLC candles and WebSocket price/account streaming, backed by a GraphQL subgraph.
  Client modes span read-only, trader-signed, and backend-controlled delegated /
  Safe-based gasless execution, with a testnet on Arbitrum Sepolia.
